name: ERC-7201 storage layout guard
description: Check source-bound snapshots and append-only compatibility against a trusted commit.
inputs:
  working-directory:
    description: Consumer Foundry project root
    default: '.'
  probe:
    description: Fully qualified source.sol:Probe contract
    required: true
  manifest:
    description: JSON manifest path
    required: true
  baseline:
    description: Committed snapshot path
    required: true
  baseline-ref:
    description: Trusted base or release commit (fetch before invoking)
    required: true
  foundry-profile:
    description: Consumer Foundry profile
    default: ci
runs:
  using: composite
  steps:
    - name: Verify storage compatibility
      shell: bash
      env:
        GUARD_ROOT: ${{ github.action_path }}
        PROJECT: ${{ inputs.working-directory }}
        PROBE: ${{ inputs.probe }}
        MANIFEST: ${{ inputs.manifest }}
        BASELINE: ${{ inputs.baseline }}
        BASE_REF: ${{ inputs.baseline-ref }}
        PROFILE: ${{ inputs.foundry-profile }}
      run: |
        set -euo pipefail
        test -n "$BASE_REF" || { echo 'baseline-ref is required'; exit 1; }
        python3 "$GUARD_ROOT/check.py" --working-directory "$PROJECT" \
          --probe "$PROBE" --manifest "$MANIFEST" --baseline "$BASELINE" \
          --baseline-ref "$BASE_REF" --foundry-profile "$PROFILE"
