name: Scheduled

permissions: {}

# Weekly lanes that are too slow or too RPC-dependent for every PR: the fork suites against archive RPC
# secrets, and a coverage report. Neither is a required check or part of `CI OK`. A scheduled run uses
# this file from the default branch and tests `dev`; a manual run tests the ref it is dispatched on.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Every lane runs in one job: some suites span several chains (CCTPUSDCDemoFork forks Arc, then Sepolia or
  # Base Sepolia). Suites whose own protocol-address variables (GELATO_*, API3_*, …) are unset still skip.
  fork:
    name: Fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # A lane without its secret would skip every suite and still pass, so a missing secret fails the run.
      - name: Require archive RPC secrets
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in MAINNET_RPC_URL SEPOLIA_RPC_URL BASE_SEPOLIA_RPC_URL ARC_TESTNET_RPC_URL; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (archive-capable RPC URLs; see .env.example)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/foundry-setup
      # FORK_REQUIRE_ARCHIVE makes a pruned pinned block fail instead of skip (test/helpers/ArchiveFork.sol).
      # A fixed fuzz seed lets the toolchain's RPC cache serve fuzzed fork tests.
      - name: Run fork suites
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
          FORK_REQUIRE_ARCHIVE: "true"
          FOUNDRY_FUZZ_SEED: "0x1a77ce"
        run: forge test --match-path 'test/fork/*' --summary

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/foundry-setup
      # `make coverage`, plus lcov.info for the artifact below. Coverage builds without the optimizer, so FORGE_SNAPSHOT_EMIT=false
      # keeps the gas tests from rewriting snapshots/ with unoptimized numbers.
      - name: Coverage summary
        env:
          FORGE_SNAPSHOT_EMIT: "false"
        run: |
          set -euo pipefail
          forge coverage --report summary --md --report lcov --no-match-path 'test/fork/*' \
            --no-match-coverage '(test|script)/' | tee coverage.md
          {
            echo "## Coverage of src/ (fork suites excluded) at $(git rev-parse --short HEAD)"
            echo
            sed -n '/^| File /,$p' coverage.md | grep -E '^\| (File|Total) |^\|-'
            echo
            echo "<details><summary>Per file</summary>"
            echo
            sed -n '/^| File /,$p' coverage.md | grep '^|'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov.info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
