name: Docs

permissions: {}

# Builds and link-checks the documentation site (`make doc`) on every relevant pull request and push.
# Only the release branch (main), on push or manual dispatch, uploads the site and deploys it to GitHub
# Pages (https://dadadave80.github.io/lattice/); pull requests never need deployment credentials. The
# site build is kept out of the Solidity gates in test.yml, which skip docs-only changes.
on:
  push:
    branches:
      - main
      - dev
    paths: # keep in sync with pull_request.paths
      - "src/**"
      - "docs/**"
      - "PROGRESS.md"
      - ".github/actions/storage-layout/README.md"
      - ".github/actions/foundry-setup/**"
      - ".github/workflows/docs.yml"
      - "script/docs/**"
      - "foundry.toml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "PROGRESS.md"
      - ".github/actions/storage-layout/README.md"
      - ".github/actions/foundry-setup/**"
      - ".github/workflows/docs.yml"
      - "script/docs/**"
      - "foundry.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/foundry-setup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Build and check the site
        run: ./script/docs/build.sh
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist/public

  deploy:
    name: Deploy docs site
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
