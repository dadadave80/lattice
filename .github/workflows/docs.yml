name: Docs

permissions: {}

# Builds and link-checks the documentation site (`make doc`). It deploys nothing: publishing to GitHub
# Pages is a separate, maintainer-authorized step. The site build is kept out of the Solidity gates in
# test.yml, which skip docs-only changes.
on:
  push:
    branches:
      - main
      - dev
    paths: # keep in sync with pull_request.paths
      - "src/**"
      - "docs/**"
      - "PROGRESS.md"
      - ".github/actions/storage-layout/README.md"
      - ".github/actions/foundry-setup/**"
      - ".github/workflows/docs.yml"
      - "script/docs/**"
      - "foundry.toml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "PROGRESS.md"
      - ".github/actions/storage-layout/README.md"
      - ".github/actions/foundry-setup/**"
      - ".github/workflows/docs.yml"
      - "script/docs/**"
      - "foundry.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/foundry-setup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Build and check the site
        run: ./script/docs/build.sh
