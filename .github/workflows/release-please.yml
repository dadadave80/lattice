name: release-please

# Release Please keeps a standing "release PR" that rolls CHANGELOG.md + the version manifest forward from
# Conventional Commits; merging that PR tags the version and publishes a GitHub Release. It runs ONLY on the
# release branch (main). Day-to-day work merges into dev; promoting dev -> main via a normal PR is what feeds
# new commits here, after which this workflow opens/updates the release PR against main.
permissions: {}

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize release runs on main so two quick pushes can't race the release PR. NOT cancel-in-progress: a
# release run that is tagging/publishing must finish rather than be aborted by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions: {} # the app token below does the writing (contents, pull requests, issues for labels)
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, not a PAT: GitHub signs commits an app makes through the API, which main's
      # required-signatures rule needs, and the app's pushes still trigger CI on the release PR.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      # Manifest-driven mode: reads release-please-config.json + .release-please-manifest.json from the repo.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  storage-assets:
    name: Publish release build and storage evidence
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/foundry-setup
      - name: Require and rebuild the frozen release manifest
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          manifest="deployments/release-${RELEASE_TAG#v}.json"
          test -f "$manifest" || { echo "Missing canonical release manifest; confirm the initial owner and freeze release evidence first" >&2; exit 1; }
          jq -e --arg tag "$RELEASE_TAG" '.publication == "release" and .lattice.tag == $tag' "$manifest"
          assets=$(mktemp -d "$RUNNER_TEMP/lattice-release-assets.XXXXXX")
          RELEASE_ASSET_DIR="$assets" ./script/check-release-manifests.sh
          cp "$manifest" "$assets/"
          cp deployments/schema/*.json "$assets/"
          archive="$RUNNER_TEMP/lattice-build-info-${RELEASE_TAG}.tar.gz"
          tar -czf "$archive" -C "$assets" .
          echo "LATTICE_RELEASE_BUILD_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Validate tagged source and storage registry
        run: make storage-check
      - name: Generate the checked error and event catalog
        run: make abi-catalog ABI_CATALOG_OUTPUT="$RUNNER_TEMP/errors.json"
      - name: Attach the checked layouts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" script/upgrades/storage-registry.json script/upgrades/storage-layout.baseline "$LATTICE_RELEASE_BUILD_ARCHIVE" "$RUNNER_TEMP/errors.json" --clobber
