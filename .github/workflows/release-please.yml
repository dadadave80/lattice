name: release-please

# Release Please keeps a standing "release PR" that rolls CHANGELOG.md + the version manifest forward from
# Conventional Commits; merging that PR tags the version and publishes a GitHub Release. It runs ONLY on the
# release branch (main). Day-to-day work merges into dev; promoting dev -> main via a normal PR is what feeds
# new commits here, after which this workflow opens/updates the release PR against main.
permissions: {}

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize release runs on main so two quick pushes can't race the release PR. NOT cancel-in-progress: a
# release run that is tagging/publishing must finish rather than be aborted by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions: {} # the app token below does the writing (contents, pull requests, issues for labels)
    steps:
      # A GitHub App token, not a PAT: GitHub signs commits an app makes through the API, which main's
      # required-signatures rule needs, and the app's pushes still trigger CI on the release PR.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      # Manifest-driven mode: reads release-please-config.json + .release-please-manifest.json from the repo.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
