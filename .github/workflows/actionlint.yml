name: lint workflows

permissions: {}

# Mirrors OpenZeppelin's actionlint workflow: statically lint the GitHub Actions YAML (syntax, shellcheck of
# `run:` blocks, expression typos) on any change under .github, so a broken workflow is caught in review.
on:
  pull_request:
    paths:
      - '.github/**/*.ya?ml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image pinned by digest and matcher fetched from the v1.7.12 release commit (914e7df);
      # bump both together.
      - name: Add problem matchers
        run: |
          curl -sSL -o actionlint-matcher.json \
            https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/.github/actionlint-matcher.json
          echo "::add-matcher::actionlint-matcher.json"
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
