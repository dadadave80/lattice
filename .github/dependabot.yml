# Proposes updates to the SHA-pinned GitHub Actions. Submodules are deliberately not covered:
# a gitsubmodule PR moves the gitlink but not foundry.lock, so it would fail `forge build --locked`.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the local composite action needs its own entry.
    directories:
      - /
      - /.github/actions/*
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
